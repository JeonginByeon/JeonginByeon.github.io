<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Jeongin Byeon</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><polygon points='12,2 14.35,8.76 21.51,8.91 15.8,13.24 17.88,20.09 12,16 6.12,20.09 8.2,13.24 2.49,8.91 9.65,8.76' fill='%23FF1493'/></svg>">
    <style>
        @import url("https://use.typekit.net/hdr6tgv.css");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "neue-haas-grotesk-text", 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-style: normal;
            font-weight: 500;
            font-size: 11px;
            line-height: 12px;
            color: rgba(0, 0, 0, 0.85);
            background-color: #ffffff;
        }

        * {
            font-family: inherit;
            font-style: inherit;
            font-weight: inherit;
            font-size: inherit;
            line-height: inherit;
        }

        .page {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── LEFT PANEL ── */

        .left {
            width: 35%;
            height: 100%;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .left-nav {
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 12px;
            flex-shrink: 0;
        }

        #home-btn:hover,
        #info-btn:hover {
            color: #FF1493;
        }

        .bio {
            margin-top: 72px;
            margin-bottom: 90px;
            margin-left: 50%;
            max-width: 50%;
            padding-right: 12px;
        }

        .bio-desc {
            margin-bottom: 12px;
        }

        .bio-inquiries-label {
            margin-bottom: 0px;
        }

        .bio-inquiries-links {
            color: #999;
        }

        .bio-inquiries-links a {
            color: inherit;
            text-decoration: none;
        }

        .bio-inquiries-links a:hover {
            color: rgba(0, 0, 0, 0.85);
        }

        .info-link {
            color: inherit;
            text-decoration: none;
        }

        .info-link:hover {
            text-decoration: underline;
        }

        .project-list {
            flex: 1;
            padding: 0 12px;
            overflow: hidden;
        }

        .project-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        .project-table tbody tr {
            cursor: pointer;
        }

        .project-table td {
            padding: 0px 6px 3px 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .project-table td:last-child {
            padding-right: 0;
        }

        .col-num      { width: 6%; }
        .col-name     { width: 44%; }
        .col-category { width: 44%; }
        .col-year     { width: 6%; text-align: left; }

        .row-active td { color: rgba(0, 0, 0, 0.85); }


        .project-table tr:not(.row-active) td { color: #999; }

        .project-table tr:not(.row-active):hover td { color: rgba(0, 0, 0, 0.85); }

        .footer {
            padding: 12px;
            flex-shrink: 0;
        }

        /* ── RIGHT PANEL ── */

        .right {
            width: 65%;
            height: 100%;
            overflow-y: auto;
            padding-left: 8px;
            padding-right: 12px;
            padding-bottom: 12px;
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .right::-webkit-scrollbar {
            display: none;
        }

        .right-nav {
            display: grid;
            grid-template-columns: 1fr 2fr 2fr 1fr;
            padding: 12px 0;
        }

        .nav-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .project-image {
            width: 100%;
            display: block;
            object-fit: cover;
        }

        .image-placeholder {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(0, 0, 0, 0.3);
            margin-bottom: 12px;
        }

        .project-desc {
            padding: 20px 0;
            display: grid;
            grid-template-columns: 1fr 2fr 2fr 1fr;
        }

        .desc-body {
            grid-column: 1 / 3;
            padding-right: 24px;
        }

        .desc-credits {
            grid-column: 3 / 5;
        }

        .desc-credits p {
            margin-bottom: 2px;
        }

        /* ── HOME LIST ── */

        .home-list {
            display: flex;
            flex-direction: column;
            padding-top: 12px;
        }

        .home-entry {
            display: block;
            margin-bottom: 20px;
        }

        .home-entry-media {
            position: relative;
            width: 100%;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .home-thumb-cover,
        .home-thumb-extra {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
            display: block;
            transform: translateX(100%);
            transition: transform 0.9s ease;
        }

        .home-thumb-cover.active,
        .home-thumb-extra.active {
            transform: translateX(0);
        }

        .home-thumb-cover.leaving,
        .home-thumb-extra.leaving {
            transform: translateX(-100%);
        }

        .home-thumb-pair {
            display: flex;
        }

        .home-thumb-pair img,
        .home-thumb-pair video {
            width: 50%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        .home-entry-caption {
            text-align: left;
        }

        .home-entry-caption:hover {
            color: #FF1493;
        }

        .home-entry-title {
            display: block;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .home-entry-sub {
            display: block;
        }


        * { cursor: none; }
        img, video { -webkit-user-drag: none; user-select: none; }

        #cursor {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            width: 20px;
            height: 20px;
            transform: translate(-50%, -50%);
        }

        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 9998;
            align-items: center;
            justify-content: center;
        }

        #lightbox.active {
            display: flex;
        }

        #lightbox img, #lightbox video {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        #lightbox video { display: none; }
        #lightbox.video-mode img { display: none; }
        #lightbox.video-mode video { display: block; }

        .mobile-spacer { display: none; }
        .mobile-info-footer { display: none; }

        /* ── MOBILE ── */
        @media (max-width: 768px) {
            * { cursor: auto !important; }
            #cursor { display: none; }

            html, body { overflow: hidden; }

            .page { position: relative; }

            .left {
                width: 100%;
                height: 100vh;
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
            }

            .bio { display: none; }

            .project-list { overflow-y: visible; padding-top: 24px; }

            .right {
                position: fixed;
                top: calc(36px + env(safe-area-inset-top));
                left: 0;
                width: 100%;
                height: calc(100vh - 36px - env(safe-area-inset-top));
                overflow-y: auto;
                -webkit-overflow-scrolling: touch;
                padding: 0;
                padding-bottom: 48px;
                background: #fff;
                z-index: 100;
                transform: translateX(100%);
            }

            .right.mobile-visible {
                transform: translateX(0);
            }

            .left-nav {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                background: #fff;
                z-index: 9999;
                padding-top: calc(12px + env(safe-area-inset-top));
                padding-bottom: 12px;
            }

            .left {
                padding-top: calc(36px + env(safe-area-inset-top));
            }

            .right-nav {
                grid-template-columns: 1fr 2fr 2fr 1fr;
                padding: 24px 12px 12px;
            }

            .project-desc {
                padding: 20px 12px;
                grid-template-columns: 1fr;
            }

            .desc-body {
                grid-column: 1;
                padding-right: 0;
                margin-bottom: 20px;
            }

            .desc-credits {
                grid-column: 1;
            }

            .home-list {
                padding: 24px 12px 12px;
            }

            .mobile-back {
                display: block;
                text-align: right;
                cursor: pointer;
            }

            .mobile-br { display: inline; }
            .mobile-block { display: block; }
            .mobile-spacer { display: block; }
            .mobile-info-footer {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                background: #fff;
                padding: 12px;
                z-index: 201;
            }

            .mobile-info-footer.active {
                display: block;
            }

            .info-profile,
            .info-section {
                grid-template-columns: 1fr !important;
                padding: 24px 12px !important;
                margin-bottom: 0 !important;
                row-gap: 4px !important;
            }

            .info-profile span:empty,
            .info-section span:empty,
            .info-section div:empty {
                display: none;
            }

            .info-profile > span:first-child,
            .info-section > span:first-child {
                margin-bottom: 8px;
            }

            .info-section > p + span:not(:empty),
            .info-section > div + span:not(:empty) {
                margin-top: 16px;
            }

            .awards-section {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
            }

            .awards-section > span:first-child {
                grid-column: 1 / -1;
                margin-bottom: 8px;
            }

            .awards-section > span:empty {
                display: none;
            }

            .experience-section {
                grid-template-columns: 1fr 1fr !important;
                row-gap: 2px !important;
            }

            .experience-section > span:first-child {
                grid-column: 1 / -1;
                margin-bottom: 8px;
            }

            .experience-section > span:not(:first-child) {
                display: block;
                grid-column: 1 / -1;
                height: 0;
                margin-top: 12px;
            }

            .awards-section > p:nth-child(6) {
                grid-column: 1;
                margin-top: 12px;
            }

            .awards-section > p:nth-child(7) {
                margin-top: 12px;
            }
        }

        .mobile-back { display: none; }
        .mobile-nav { display: none; }
        .mobile-br { display: none; }
    </style>
</head>

    // 사본 목록은 tools/optimize_media.py 가 만든 manifest.js (없으면 원본 그대로)
    const withWebMedia = html => html.replace(/src="(Projects\/[^"]+?\.(?:jpe?g|png))"/gi, (match, src) => {
        const web = (window.WEB_MEDIA || {})[src];
        return web ? `src="${web}" data-full="${src}"` : match;

    const lazyVideoObserver = new IntersectionObserver(entries => {
        entries.forEach(({ target, isIntersecting }) => {
            if (isIntersecting) target.play().catch(() => {});
            else target.pause();
        });

    function showProject(index) {
        stopThumbRotation();
        lastProjectIndex = index;
        const p = projects[index];

        // 활성 행 업데이트
        document.querySelectorAll('.project-table tr[data-index]').forEach(tr => {
            tr.classList.toggle('row-active', parseInt(tr.dataset.index) === index);
        });

        // 오른쪽 패널 렌더링
        const images = p.images.map(img => {
            if (Array.isArray(img)) {
                const ratio = img[2] || '8/5';
                const renderItem = src => src.match(/\.(mp4|mov|webm)$/i)
                    ? `<video src="${src}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;" muted loop playsinline preload="none"></video>`
                    : `<img src="${src}" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center; display: block;" loading="lazy">`;
                return `<div data-split="${ratio}" style="position: relative; width: 100%; margin-bottom: 12px; overflow: hidden;"><div style="position: absolute; top: 0; left: 0; bottom: 0; width: calc(50% + 1px); overflow: hidden;">${renderItem(img[0])}</div><div style="position: absolute; top: 0; left: 50%; right: 0; bottom: 0; overflow: hidden;">${renderItem(img[1])}</div></div>`;
            } else if (typeof img === 'object' && img.src) {
                const isVideo = img.src.match(/\.(mp4|mov|webm)$/i);
                if (img.half) {
                    const inner = isVideo
                        ? `<video src="${img.src}" style="width: 100%; display: block;" muted loop playsinline preload="none"></video>`
                        : `<img src="${img.src}" style="width: 100%; display: block;" loading="lazy">`;
                    return `<div style="width: 50%; margin: 0 auto 12px; display: block;">${inner}</div>`;
                }
                const inner = isVideo
                    ? `<video src="${img.src}" style="width: 100%; display: block;" muted loop playsinline preload="none"></video>`
                    : `<img src="${img.src}" style="width: 100%; display: block;" loading="lazy">`;
                return `<a href="${img.link}" target="_blank" style="display: block; margin-bottom: 12px;">${inner}</a>`;
            } else if (img.startsWith('#')) {
                return `<div class="image-placeholder" style="aspect-ratio: 1920 / 1200; background: ${img};">Image placeholder</div>`;
            } else if (img.match(/\.(mp4|mov|webm)$/i)) {
                return `<video src="${img}" style="width: 100%; display: block; margin-bottom: 12px;" muted loop playsinline preload="none"></video>`;
            } else {
                return `<img src="${img}" style="width: 100%; display: block; margin-bottom: 12px;" loading="lazy">`;
            }
        }).join('');

        const isMobile = window.innerWidth <= 768;
        if (isMobile) {
            document.getElementById('right-panel').classList.add('mobile-visible');
        }

        document.getElementById('right-panel').innerHTML = withWebMedia(`
            <div class="right-nav">

                </div>

            </div>
        `);

        document.getElementById('right-panel').scrollTop = 0;
        document.getElementById('mobile-legal-footer').classList.remove('active');

        lazyVideoObserver.disconnect();
        observeVideos(document.getElementById('right-panel').querySelectorAll('video'));

        const setSplitHeights = () => {
            const panelW = document.getElementById('right-panel').getBoundingClientRect().width || window.innerWidth;
            document.querySelectorAll('[data-split]').forEach(el => {
                const [rw, rh] = el.dataset.split.split('/').map(Number);
                const w = isMobile ? panelW : el.offsetWidth;
                if (w > 0) el.style.height = Math.round(w * rh / rw) + 'px';
            });
        };
        if (isMobile) {
            requestAnimationFrame(() => requestAnimationFrame(setSplitHeights));
        } else {
            setSplitHeights();
        }
    }

    window.addEventListener('resize', () => {
        document.querySelectorAll('[data-split]').forEach(el => {
            const [rw, rh] = el.dataset.split.split('/').map(Number);
            el.style.height = Math.round(el.offsetWidth * rh / rw) + 'px';
        });
    });

    // 프로젝트 이미지 목록에서 정지 이미지 소스만 추출 (첫 번째 = 대표 커버, 최대 5장)
    const isHomeImg = s => typeof s === 'string' && !s.startsWith('#') && !s.match(/\.(mp4|mov|webm)$/i);
    const isHomeMedia = s => typeof s === 'string' && !s.startsWith('#'); // 이미지 또는 영상

    // 커버 슬라이드 결정: homeThumb이 있으면 단일 이미지로 고정, 없으면 데이터 순서 그대로
    // p.images[0]을 사용 (배열로 이미 짝지어진 경우 두 장을 나란히 붙인 커버로 — 순서를 건너뛰지 않음)
    function getHomeCoverSlide(p) {
        if (p.homeThumb) {
            return isHomeImg(p.homeThumb) ? { type: 'single', src: p.homeThumb } : null;
        }
        const first = p.images[0];
        if (Array.isArray(first)) {
            const [a, b] = first;
            if (isHomeMedia(a) && isHomeMedia(b)) return { type: 'pair', src: [a, b] };
            if (isHomeImg(a)) return { type: 'single', src: a };
            if (isHomeImg(b)) return { type: 'single', src: b };
            return null;
        }
        if (typeof first === 'object' && first !== null && first.src) {
            return isHomeImg(first.src) ? { type: 'single', src: first.src } : null;
        }
        return isHomeImg(first) ? { type: 'single', src: first } : null;
    }

    // 커버 이후 호버 시 넘어갈 추가 슬라이드 구성 (최대 4장).
    // 데이터에 ['img1','img2']로 이미 짝지어진 항목(세로형 2장 조합)은 상세 페이지처럼 나란히 붙인 슬라이드로 처리
    function getHomeExtraSlides(p, excludeSrcs) {
        const seen = new Set(excludeSrcs);
        const slides = [];

        const take = src => {
            if (!isHomeMedia(src) || seen.has(src)) return false;
            seen.add(src);
            return true;
        };

        for (const img of p.images) {
            let entry = null;
            if (Array.isArray(img)) {
                // 한쪽이 영상인 "혼합 쌍"도 원본처럼 나란히 붙여서 보여줌 (둘 다 placeholder가 아니면 채택)
                const [a, b] = img;
                if (isHomeMedia(a) && isHomeMedia(b) && !seen.has(a) && !seen.has(b)) {
                    seen.add(a);
                    seen.add(b);
                    entry = { type: 'pair', src: [a, b] };
                }
            } else if (typeof img === 'object' && img !== null && img.src) {
                if (take(img.src)) entry = { type: 'single', src: img.src };
            } else if (typeof img === 'string') {
                if (take(img)) entry = { type: 'single', src: img };
            }
            if (entry) slides.push(entry);
            if (slides.length >= 4) break;
        }
        return slides;
    }

    // slide 객체(single/pair)를 실제 마크업으로 변환
    function renderHomeSlide(slide, baseClass, active) {
        const activeClass = active ? ' active' : '';
        // 영상은 미리 받지 않음(preload="none"): 커버는 화면에 보일 때 lazyVideoObserver가,
        // 호버 슬라이드는 실제로 넘어갈 때 재생하면서 불러옴
        const videoAttrs = 'muted loop playsinline preload="none"';
        if (slide.type === 'pair') {
            const renderHalf = src => src.match(/\.(mp4|mov|webm)$/i)
                ? `<video src="${src}" ${videoAttrs}></video>`
                : `<img src="${src}" loading="lazy">`;
            return `<div class="${baseClass} home-thumb-pair${activeClass}">
                ${renderHalf(slide.src[0])}
                ${renderHalf(slide.src[1])}
            </div>`;
        }
        if (slide.src.match(/\.(mp4|mov|webm)$/i)) {
            return `<video src="${slide.src}" class="${baseClass}${activeClass}" ${videoAttrs}></video>`;
        }
        return `<img src="${slide.src}" loading="lazy" class="${baseClass}${activeClass}">`;
    }

    // 대표 이미지(커버) + 마우스오버 시 넘어갈 추가 이미지 마크업 생성
    function getEntryMediaMarkup(p) {
        const coverSlide = getHomeCoverSlide(p);

        if (coverSlide) {
            const coverMarkup = renderHomeSlide(coverSlide, 'home-thumb-cover', true);
            const excludeSrcs = coverSlide.type === 'pair' ? coverSlide.src : [coverSlide.src];
            const extraMarkup = getHomeExtraSlides(p, excludeSrcs)
                .map(slide => renderHomeSlide(slide, 'home-thumb-extra', false))
                .join('');
            return coverMarkup + extraMarkup;
        }

        // 정지 이미지가 없는 경우(동영상/placeholder만 있는 프로젝트) 대체 표시 — 회전 없음
        let cover;
        if (p.homeThumb) {
            cover = p.homeThumb;
        } else {
            const first = p.images[0];
            if (Array.isArray(first)) cover = first[0];
            else if (typeof first === 'object' && first !== null && first.src) cover = first.src;
            else cover = first;
        }
        if (typeof cover === 'string' && cover.startsWith('#')) {
            return `<div class="home-thumb-cover active" style="background:${cover};"></div>`;
        }
        if (typeof cover === 'string' && cover.match(/\.(mp4|mov|webm)$/i)) {
            return `<video src="${cover}" class="home-thumb-cover active" muted loop playsinline preload="none"></video>`;
        }
        return `<img src="${cover}" loading="lazy" class="home-thumb-cover active">`;
    }

    // 마우스를 올렸을 때만 다음 이미지로 슬라이드, 벗어나면 커버 이미지로 복귀
    let homeRotationTimers = [];
    function stopThumbRotation() {
        homeRotationTimers.forEach(id => clearInterval(id));
        homeRotationTimers = [];
    }
    function setupHomeHoverSlides(container) {
        container.querySelectorAll('.home-entry-media').forEach(media => {
            const cover = media.querySelector('.home-thumb-cover');
            const extras = Array.from(media.querySelectorAll('.home-thumb-extra'));
            if (!cover || extras.length === 0) return;

            // 커버도 다른 슬라이드와 동일하게 옆으로 밀려나가고 들어오도록 같은 목록으로 취급
            const slides = [cover, ...extras];
            const state = { activeIndex: 0, timerId: null, delayId: null };

            const resetSlide = el => {
                el.style.transition = 'none';
                el.classList.remove('leaving');
                void el.offsetWidth; // 강제 리플로우로 트랜지션 비활성화 반영
                el.style.transition = '';
            };

            // 실제로 화면에 보일 때만 영상을 불러와 재생, 지나가면 멈춰서 불필요한 로딩 방지
            const videosIn = el => el.tagName === 'VIDEO' ? [el] : Array.from(el.querySelectorAll('video'));
            const playVideosIn = el => videosIn(el).forEach(v => { v.muted = true; v.play().catch(() => {}); });
            const pauseVideosIn = el => videosIn(el).forEach(v => v.pause());

            const advance = () => {
                const prev = state.activeIndex;
                const next = (prev + 1) % slides.length;
                const prevEl = slides[prev];
                prevEl.classList.remove('active');
                prevEl.classList.add('leaving');
                setTimeout(() => { resetSlide(prevEl); pauseVideosIn(prevEl); }, 950);
                slides[next].classList.add('active');
                playVideosIn(slides[next]);
                state.activeIndex = next;
            };

            // 스크롤하며 지나갈 때는 넘어가지 않도록, 잠시 머물러야 슬라이드 시작
            const HOVER_DELAY = 700;
            const cancelDelay = () => {
                if (state.delayId) {
                    clearTimeout(state.delayId);
                    homeRotationTimers = homeRotationTimers.filter(id => id !== state.delayId);
                    state.delayId = null;
                }
            };
            const scheduleStart = () => {
                cancelDelay();
                state.delayId = setTimeout(() => {
                    state.delayId = null;
                    advance();
                    state.timerId = setInterval(advance, 2500);
                    homeRotationTimers.push(state.timerId);
                }, HOVER_DELAY);
                homeRotationTimers.push(state.delayId);
            };

            media.addEventListener('mouseenter', () => {
                if (state.timerId) return;
                scheduleStart();
            });

            // 아직 시작 전인데 스크롤 중이면 대기 시간을 다시 계산
            media.addEventListener('wheel', () => {
                if (!state.timerId && state.delayId) scheduleStart();
            }, { passive: true });

            media.addEventListener('mouseleave', () => {
                cancelDelay();
                if (state.timerId) {
                    clearInterval(state.timerId);
                    homeRotationTimers = homeRotationTimers.filter(id => id !== state.timerId);
                    state.timerId = null;
                }
                // 트랜지션 없이 즉시 커버 이미지로 복귀
                slides.forEach(el => {
                    el.style.transition = 'none';
                    el.classList.remove('leaving');
                    el.classList.remove('active');
                    if (el !== cover) pauseVideosIn(el);
                });
                cover.classList.add('active');
                playVideosIn(cover);
                void media.offsetWidth;
                slides.forEach(el => { el.style.transition = ''; });
                state.activeIndex = 0;
            });
        });
    }

    // 세로형 이미지는 가로형과 같은 높이를 유지하되, 박스 폭을 이미지 본래 비율에 맞게 좁혀서
    // 가로형 프레임에 억지로 크롭되지 않고 세로형 비율 그대로 보이게 함
    function applyPortraitShape(container) {
        const LANDSCAPE_RATIO = 0.625; // 가로형 커버 이미지의 기준 높이/너비 비율 (8:5)

        container.querySelectorAll('.home-entry-media').forEach(media => {
            const el = media.querySelector('.home-thumb-cover');
            if (!el) return;

            if (el.classList.contains('home-thumb-pair')) {
                // 세로형 2장을 나란히 붙인 커버는 그 자체로 가로형 비율에 맞춰 꽉 채움
                const fullWidth = media.parentElement.clientWidth;
                media.style.width = '';
                media.style.marginLeft = '';
                media.style.marginRight = '';
                media.style.height = (fullWidth * 0.625) + 'px';
                const caption = media.parentElement.querySelector('.home-entry-caption');
                if (caption) caption.style.marginLeft = '';
                return;
            }

            const apply = (w, h) => {
                if (!w || !h) return;
                const ratio = h / w;
                // 이전에 좁혀놓은 폭(media.clientWidth)이 아니라, 부모(.home-entry) 기준
                // 패널 전체 폭을 매번 새로 읽어야 창 크기 변경 시에도 정확히 재계산됨
                const fullWidth = media.parentElement.clientWidth;
                const caption = media.parentElement.querySelector('.home-entry-caption');

                if (ratio <= 0.9) {
                    // 가로형/정사각형에 가까우면 원본 비율 그대로, 폭 100%, 크롭 없음
                    // (커버가 absolute로 전환되며 박스 자체 높이를 더는 자동으로 못 잡아주므로 직접 지정)
                    media.style.width = '';
                    media.style.marginLeft = '';
                    media.style.marginRight = '';
                    media.style.height = (fullWidth * ratio) + 'px';
                    if (caption) caption.style.marginLeft = '';
                    return;
                }

                // 세로형: 가로형과 같은 높이를 유지하되, 박스 폭을 이미지 본래 비율에 맞게 좁힘
                const targetHeight = fullWidth * LANDSCAPE_RATIO;
                const narrowWidth = targetHeight / ratio;
                media.style.height = targetHeight + 'px';
                media.style.width = narrowWidth + 'px';
                media.style.marginLeft = 'auto';
                media.style.marginRight = 'auto';

                // 설명 텍스트를 세로형 이미지 시작 위치(좌측 여백)에 맞춰 정렬
                const offset = (fullWidth - narrowWidth) / 2;
                if (caption) caption.style.marginLeft = offset + 'px';
            };

            if (el.tagName === 'IMG') {
                if (el.complete && el.naturalWidth) {
                    apply(el.naturalWidth, el.naturalHeight);
                } else {
                    el.addEventListener('load', () => apply(el.naturalWidth, el.naturalHeight));
                }
            } else if (el.tagName === 'VIDEO') {
                if (el.readyState >= 1 && el.videoWidth) {
                    apply(el.videoWidth, el.videoHeight);
                } else {
                    el.addEventListener('loadedmetadata', () => apply(el.videoWidth, el.videoHeight));
                }
            } else {
                // 정지 이미지가 아예 없는 placeholder(#컬러) 커버 — 기본 4:3 비율로 박스 높이 지정
                apply(4, 3);
            }
        });
    }

    // 창 크기가 바뀔 때 세로형 썸네일 폭/캡션 위치를 다시 계산 (홈 화면일 때만)
    window.addEventListener('resize', () => {
        if (document.querySelector('.home-list')) {
            applyPortraitShape(document.getElementById('right-panel'));
        }
    });

    function showHome() {
        stopThumbRotation();
        lastProjectIndex = null;

        // 활성 행 해제
        document.querySelectorAll('.project-table tr[data-index]').forEach(tr => {
            tr.classList.remove('row-active');
        });

        if (window.innerWidth <= 768) {
            document.getElementById('right-panel').classList.add('mobile-visible');
        }

        const entries = projects.map((p, i) => `
            <div class="home-entry" data-index="${i}">
                <div class="home-entry-media">${getEntryMediaMarkup(p)}</div>
                <div class="home-entry-caption">
                    <span class="home-entry-title">${p.name}${p.subtitle ? ' ' + p.subtitle : ''}</span>
                    <span class="home-entry-sub">${p.category}${p.client ? ' · ' + p.client : ''}</span>
                </div>
            </div>
        `).join('');

        document.getElementById('right-panel').innerHTML = withWebMedia(`<div class="home-list">${entries}</div>`);
        document.getElementById('right-panel').scrollTop = 0;
        document.getElementById('mobile-legal-footer').classList.remove('active');

        applyPortraitShape(document.getElementById('right-panel'));
        setupHomeHoverSlides(document.getElementById('right-panel'));

        document.getElementById('right-panel').querySelectorAll('.home-entry').forEach(entry => {
            entry.addEventListener('click', () => {
                infoActive = false;
                showProject(parseInt(entry.dataset.index));
            });
        });

        // 처음부터 보이는 커버 영상만 바로 재생 (호버해야 보이는 추가 슬라이드 영상은 그대로 둠)
        lazyVideoObserver.disconnect();
        observeVideos(document.getElementById('right-panel').querySelectorAll('video.home-thumb-cover, .home-thumb-cover video'));
    }

    // 커스텀 커서
    const cursor = document.getElementById('cursor');
    document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });

    document.addEventListener('contextmenu', e => {
        if (e.target.closest('img, video')) e.preventDefault();
    });

    function showInfo() {
        stopThumbRotation();
        document.querySelectorAll('.project-table tr').forEach(tr => {
            tr.classList.remove('row-active');
        });

        if (window.innerWidth <= 768) {
            document.getElementById('right-panel').classList.add('mobile-visible');
        }

        document.getElementById('right-panel').innerHTML = `
            <div class="right-nav info-profile">
                <span>Profile</span>
                <span style="padding-right: 24px;">Jeongin Byeon (b. 1999, Seoul) is a designer based in London and Seoul, spanning various design practices to realize concepts.</span>
                <span>Work by Jeongin Byeon — including self-initiated, freelance, and <span class="mobile-block">in-company projects.</span></span>
                <span></span>
            </div>

            <div class="info-section experience-section" style="display: grid; grid-template-columns: 1fr 2fr 1fr 1fr 1fr; padding: 0; row-gap: 2px; align-items: start;" id="experience-section">
                <span>Experience</span>
                <p>Now</p>
                <p>Designer</p>
                <p>Freelance</p>
                <p>London / Seoul</p>

                <span></span>
                <p>2023 — 2026</p>
                <p>Creative Visual Designer</p>
                <p>SM Entertainment</p>
                <p>Seoul, Korea</p>

                <span></span>
                <p>2023</p>
                <p>Brand Designer</p>
                <p>BRENDEN</p>
                <p>Seoul, Korea</p>

                <span></span>
                <p>2021</p>
                <p>Brand Design Intern</p>
                <p>Danggeun Market (Karrot)</p>
                <p>Seoul, Korea</p>

                <span></span>
                <p>2020 — 2021</p>
                <p>Global Mktg Design Intern</p>
                <p>Danggeun Market (Karrot)</p>
                <p>Seoul, Korea</p>

                <span></span>
                <p>2020</p>
                <p>Brand Design Intern</p>
                <p>motemote</p>
                <p>Seoul, Korea</p>
            </div>

            <div class="info-section awards-section" style="display: grid; grid-template-columns: 1fr 2fr 1fr 2fr; padding: 0; row-gap: 2px; align-items: start;" id="awards-section">
                <span>Awards</span>
                <p>iF Design Award 2024</p>
                <p><a href="https://ifdesign.com//winner-ranking/project/sockpiens/621605" target="_blank" class="info-link">Sockpiens</a></p>
                <p>Branding & Communication Design</p>

                <span></span>
                <p>Red Dot Design Award 2026</p>
                <p><a href="https://www.red-dot.org/project/aespa-single-dirty-work-dirty-case-ver-90207" target="_blank" class="info-link">aespa Dirty Work</a></p>
                <p>Product Design</p>
            </div>

            <div class="info-section" style="display: grid; grid-template-columns: 1fr 2fr 2fr 1fr; padding: 0 0 60px;" id="contact-section">
                <span>Contact</span>
                <div>
                    <p style="margin-bottom: 2px;"><a href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=jeongin9910@gmail.com" target="_blank" class="info-link">jeongin9910@gmail.com</a></p>
                    <p style="margin-bottom: 2px;"><a href="https://www.instagram.com/ni_gnoej_/" target="_blank" class="info-link">Instagram</a></p>
                    <p style="margin-bottom: 2px;"><a href="https://www.linkedin.com/in/jeongin-byeon" target="_blank" class="info-link">LinkedIn</a></p>
                    <p style="margin-bottom: 2px;"><a href="Projects/CV/Jeongin%20Byeon_CV_2026.pdf" download="Jeongin Byeon_CV_2026.pdf" class="info-link">CV</a></p>
                    <p class="mobile-spacer">&nbsp;</p>
                </div>
                <div>
                    <p style="margin-bottom: 2px;">London, UK</p>
                    <p style="margin-bottom: 2px;">Seoul, Korea</p>
                </div>
                <div></div>
            </div>
        `;

        document.getElementById('right-panel').scrollTop = 0;
        if (window.innerWidth <= 768) {
            document.getElementById('mobile-legal-footer').classList.add('active');
        }

        requestAnimationFrame(() => {
            const bioDesc = document.getElementById('bio-desc');
            const clientRow = document.getElementById('client-label-row');
            const personalRow = document.getElementById('personal-label-row');
            const experienceEl = document.getElementById('experience-section');
            const awardsEl = document.getElementById('awards-section');
            const contactEl = document.getElementById('contact-section');
            if (!bioDesc || !clientRow || !personalRow || !experienceEl || !awardsEl || !contactEl) return;

            const bioTop = bioDesc.getBoundingClientRect().top;
            const expTop = experienceEl.getBoundingClientRect().top;
            experienceEl.style.paddingTop = Math.max(0, bioTop - expTop) + 'px';

            requestAnimationFrame(() => {
                const clientTop = clientRow.getBoundingClientRect().top;
                const awardsTop = awardsEl.getBoundingClientRect().top;
                awardsEl.style.paddingTop = Math.max(0, clientTop - awardsTop) + 'px';

                requestAnimationFrame(() => {
                    const personalTd = personalRow.querySelector('td');
                    const personalPadTop = parseFloat(personalTd.style.paddingTop) || 35;
                    const personalTop = personalRow.getBoundingClientRect().top + personalPadTop;
                    const contactTop = contactEl.getBoundingClientRect().top;
                    contactEl.style.paddingTop = Math.max(0, personalTop - contactTop) + 'px';
                });
            });
        });
    }

    let infoActive = false;
    let lastProjectIndex = null;
    document.getElementById('info-btn').addEventListener('click', () => {
        if (infoActive) {
            infoActive = false;
            if (lastProjectIndex === null) {
                showHome();
            } else {
                showProject(lastProjectIndex);
            }
        } else {
            infoActive = true;
            showInfo();
        }
    });
    document.getElementById('home-btn').addEventListener('click', () => {
        infoActive = false;
        showHome();
    });

    // 리스트 행 생성
    const tbody = document.getElementById('project-tbody');
    const clientLabel = document.createElement('tr');
    clientLabel.id = 'client-label-row';
    clientLabel.innerHTML = `<td colspan="4" style="padding-bottom: 4px; color: rgba(0,0,0,0.85); cursor: default; pointer-events: none;">Commercial</td>`;
    tbody.appendChild(clientLabel);
    projects.forEach((p, i) => {
        if (i === 10) {
            const spacer = document.createElement('tr');
            spacer.id = 'personal-label-row';
            spacer.innerHTML = `<td colspan="4" style="padding-top: 35px; padding-bottom: 4px; color: rgba(0,0,0,0.85); cursor: default; pointer-events: none;">Personal</td>`;
            tbody.appendChild(spacer);
        }
        const tr = document.createElement('tr');
        tr.dataset.index = i;
        tr.innerHTML = `
            <td class="col-num">${p.num}</td>
            <td class="col-name">${p.name}${p.subtitle ? ' ' + p.subtitle : ''}</td>
            <td class="col-category">${p.category}</td>
            <td class="col-year">${p.year}</td>
        `;
        tr.addEventListener('click', () => { infoActive = false; showProject(i); });
        tbody.appendChild(tr);
    });

    // 라이트박스
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const lightboxVideo = document.getElementById('lightbox-video');

    document.getElementById('right-panel').addEventListener('click', e => {
        if (e.target.closest('.home-entry')) return; // 홈 리스트 썸네일은 라이트박스 대신 프로젝트로 이동
        if (e.target.tagName === 'IMG') {
            lightboxImg.src = e.target.src;
            const full = e.target.dataset.full;
            if (full) {
                const original = new Image();
                original.onload = () => { if (lightboxImg.src === e.target.src) lightboxImg.src = full; };
                original.src = full;
            }
            lightbox.classList.remove('video-mode');
            lightbox.classList.add('active');
        } else if (e.target.tagName === 'VIDEO' && !e.target.closest('a')) {
            lightboxVideo.src = e.target.src;
            lightboxVideo.play();
            lightbox.classList.add('video-mode', 'active');
        }
    });

    lightbox.addEventListener('click', () => {
        lightbox.classList.remove('active', 'video-mode');
        lightboxVideo.pause();
        lightboxVideo.src = '';
    });

    // 초기 로드
    showHome();
</script>

</body>
</html>
